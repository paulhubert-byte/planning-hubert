<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<title>Planning HUBERT</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════ VARIABLES ═══════════════════ */
:root{
  --bg:#f8fafc; --surf:#ffffff; --surf2:#f1f5f9; --bord:#e2e8f0; --bord2:#cbd5e1;
  --acc:#0891b2; --text:#1e293b; --dim:#64748b;
  --sh:0 1px 6px rgba(0,0,0,.07);
  --CW:calc((100vw - 148px - 115px - 20px) / 10); /* remplit l'écran (5j × 2) */
  --CH:28px; /* hauteur 1 ligne */
  --NOM:115px; /* largeur colonne nom chantier */
}
/* Couleurs salariés */
.c0{--c:#2563eb} .c1{--c:#16a34a} .c2{--c:#0891b2} .c3{--c:#9333ea}
.c4{--c:#d97706} .c5{--c:#dc2626} .c6{--c:#e11d48} .c7{--c:#0d9488}
.c8{--c:#ea580c} .c9{--c:#4f46e5}
.cs0{--c:#b45309} .cs1{--c:#c2410c} .cs2{--c:#b91c1c} .cs3{--c:#a16207}
.ct0{--c:#7c3aed} .ct1{--c:#be185d} .ct2{--c:#0f766e}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:13px}

/* ═══════════════════ HEADER ═══════════════════ */
header{
  display:flex;align-items:center;gap:10px;
  padding:6px 16px;height:50px;
  background:#1e293b;
  border-bottom:none;
  box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:50;flex-shrink:0;
}
.logo-wrap{display:flex;align-items:center;gap:8px;min-width:120px}
#logoImg{height:34px;width:auto;object-fit:contain;display:none}
#logoTxt{font-size:18px;font-weight:700;color:#f0f9ff;letter-spacing:-.5px}
.week-info{display:flex;flex-direction:column;align-items:center;line-height:1.2;cursor:pointer}
.week-info:hover .week-num{text-decoration:underline;text-underline-offset:2px}
/* Popup sélecteur semaine */
#weekPicker{
  position:fixed;top:54px;left:50%;transform:translateX(-50%);
  background:#1e293b;border:1px solid #334155;border-radius:12px;
  padding:14px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.35);
  display:none;min-width:240px;
}
#weekPicker.on{display:block}
#weekPicker h4{color:#f1f5f9;font-size:12px;font-weight:600;
  text-align:center;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
#weekPicker .wp-row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
#weekPicker label{color:#94a3b8;font-size:11px;font-weight:600;min-width:50px}
#weekPicker select,#weekPicker input{
  flex:1;background:#334155;border:1px solid #475569;color:#f1f5f9;
  border-radius:6px;padding:5px 7px;font-size:12px;font-family:inherit;outline:none}
#weekPicker .wp-btns{display:flex;gap:6px;margin-top:10px}
#weekPicker .wp-ok{flex:1;background:#0891b2;color:#fff;border:none;
  border-radius:7px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
#weekPicker .wp-ok:hover{background:#0e7490}
#weekPicker .wp-cancel{background:#334155;color:#94a3b8;border:none;
  border-radius:7px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
/* Raccourcis rapides */
#weekPicker .wp-shortcuts{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
#weekPicker .wp-sc{background:#334155;color:#cbd5e1;border:1px solid #475569;
  border-radius:5px;padding:3px 8px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit}
#weekPicker .wp-sc:hover{background:#475569;color:#fff}
.week-num{font-size:13px;font-weight:600;color:#f8fafc}
.week-dates{font-size:10px;color:#94a3b8}
.wnav{display:flex;align-items:center;gap:4px}
.wnav button{width:26px;height:26px;border-radius:6px;
  border:1px solid #334155;background:#334155;color:#94a3b8;
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:all .15s}
.wnav button:hover{background:#475569;color:#fff}
.hbtns{display:flex;gap:5px;align-items:center;margin-left:auto}
.ibtn{padding:5px 10px;border-radius:6px;
  border:1px solid #334155;background:#334155;color:#cbd5e1;
  cursor:pointer;font-size:11px;font-weight:500;
  font-family:inherit;white-space:nowrap;transition:all .15s}
.ibtn:hover{background:#475569;color:#fff;border-color:#475569}
.ibtn.acc{background:#0891b2;color:#fff;border-color:#0891b2;font-weight:600}
.ibtn.acc:hover{background:#0e7490}
.ibtn.on{background:#0891b2;color:#fff;border-color:#0891b2}
#sdot{width:8px;height:8px;border-radius:50%;background:#4ade80;flex-shrink:0}

/* ═══════════════════ LAYOUT ═══════════════════ */
.app{display:flex;height:calc(100vh - 50px);overflow:hidden}

/* ═══════════════════ GRILLE ═══════════════════ */
.grid-wrap{flex:1;overflow:auto;position:relative;min-width:0}
.grid-wrap::-webkit-scrollbar{width:5px;height:5px}
.grid-wrap::-webkit-scrollbar-thumb{background:var(--bord2);border-radius:3px}

/* ═══════════════════ TABLEAU ═══════════════════ */
.ptable{border-collapse:collapse;table-layout:fixed}
/* Colonne nom */
col.col-nom{width:var(--NOM)}
col.col-hj{width:var(--CW);min-width:60px}
col.col-btn{width:20px}

/* Header du tableau */
.ptable thead th{
  background:#334155;border:1px solid #475569;
  padding:0;text-align:center;
  position:sticky;top:0;z-index:20;white-space:nowrap;
}
.th-nom{background:#334155!important}
.th-day{font-size:9px;font-weight:600;color:#94a3b8;
  text-transform:uppercase;padding:3px 2px 1px;letter-spacing:.5px}
.th-day b{font-size:12px;font-weight:700;color:#f1f5f9;display:block}
.th-hf{font-size:8px;font-weight:500;color:#64748b;padding:1px 0;
  border-top:1px solid #475569;display:grid;grid-template-columns:1fr 1fr}
.th-hf span{padding:1px 0}
.th-hf span:first-child{border-right:1px dashed #475569}
/* Today header */
.today-th .th-day{background:#1e40af}
.today-th .th-day,.today-th .th-day b{color:#bfdbfe}
/* Férié header */
.ferie-th .th-day{background:#991b1b}
.ferie-th .th-day b{color:#fca5a5}

/* Cellules données */
.ptable td{
  border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;
  padding:0;height:var(--CH);overflow:hidden;
  background:#fff;cursor:pointer;
}
/* Séparateurs Mat/AM : pointillés très discrets */
.ptable td.am{border-right:1px dashed #e2e8f0!important}
/* Séparation journées */
.ptable td:not(.am):not(.chtit):not(.vtick-cell):not(.sptit):not(.spacer):not(.spacer-lg):not(.ch-x-cell){
  border-right:1px solid #cbd5e1;
}
/* Weekend : gris très clair */
.ptable td.wk{background:#fafafa}
.ptable td.wks{border-left:2px solid #cbd5e1!important}
/* Férié : rouge pâle */
.ptable td.jf{background:#fff5f5!important}
/* Today : bleu très pâle, lisible */
.ptable td.today-col{background:#eff6ff!important}
/* Drop */
.ptable td.dov{background:#e0f2fe!important}

/* Ligne titre chantier */
.ptable td.chtit{
  background:#334155;color:#f1f5f9;
  font-size:10px;font-weight:600;
  padding:2px 18px 2px 8px;
  white-space:normal;word-break:break-word;line-height:1.25;
  vertical-align:middle;cursor:default;position:relative;
  border-top:2px solid #1e293b;
  height:auto!important;min-height:var(--CH);
}
.ptable td.vtick-cell{
  background:#334155;border-top:2px solid #1e293b;
  border-left:1px solid #475569;
  text-align:center;vertical-align:middle;padding:2px;
  height:auto!important;min-height:var(--CH);
}
.ptable td.vtick-cell.today-vc{background:#1e3a8a!important}
.ptable td.ch-x-cell{
  background:#334155;border-top:2px solid #1e293b;
  text-align:center;vertical-align:middle;padding:0;
  height:auto!important;
}
/* Bouton masquer dans nom */
.chtit-x{
  position:absolute;top:50%;right:3px;transform:translateY(-50%);
  background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.55);
  cursor:pointer;font-size:9px;border-radius:3px;
  width:14px;height:14px;display:flex;align-items:center;justify-content:center;
  line-height:1;padding:0;transition:all .15s;
}
.chtit-x:hover{background:rgba(239,68,68,.5);color:#fff;transform:translateY(-50%) scale(1.1)}

/* Pastilles visite */
.vtick{
  width:18px;height:18px;border-radius:4px;
  border:1.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.9);
  cursor:pointer;font-size:10px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
  color:#334155;font-family:inherit;transition:all .12s;
}
.vtick:hover{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.vtick.has-v{background:#dcfce7;border-color:#22c55e;color:#15803d}
.vtick.has-v-x{background:#fee2e2;border-color:#ef4444;color:#dc2626}

/* Lignes spéciales CFA/CP/ABS */
.ptable td.sptit{font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;padding:2px 8px;cursor:default;
  border-top:3px solid #1e293b;vertical-align:middle;
  height:auto!important;min-height:var(--CH);
}
.ptable td.sptit.cfa{background:#c2410c;color:#fff}
.ptable td.sptit.cp{background:#1d4ed8;color:#fff}
.ptable td.sptit.abs{background:#b91c1c;color:#fff}
/* Cellules lignes sp : blanc comme les chantiers */
.ptable td.sp-cfa,.ptable td.sp-cp,.ptable td.sp-abs{background:#fff}

/* Spacer entre chantiers */
.ptable td.spacer{height:4px;background:#f1f5f9;border:none;padding:0}
.ptable td.spacer-lg{height:8px;background:#e2e8f0;border-top:2px solid #94a3b8;border-bottom:none;padding:0}

/* ═══════════════════ OVERLAY TAGS ═══════════════════
   #ov est dans .grid-wrap (qui scrolle) → tags scrollent avec
   position:absolute, coords calculées depuis getBoundingClientRect + scroll
════════════════════════════════════════════════════ */
#ov{position:absolute;top:0;left:0;width:100%;height:200%;pointer-events:none;z-index:10}

/* Tags étirables */
.tag{
  position:absolute;
  display:flex;align-items:center;
  height:calc(var(--CH) - 4px);
  border-radius:4px;
  border:1.5px solid color-mix(in srgb,var(--c,#2563b0) 45%,#fff);
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  font-size:10px;font-weight:600;
  cursor:grab;user-select:none;touch-action:none;
  pointer-events:auto;
  overflow:hidden;white-space:nowrap;
  box-sizing:border-box;z-index:10;
  background:color-mix(in srgb,var(--c,#2563eb) 28%,#fff);
  color:color-mix(in srgb,var(--c,#2563eb) 90%,#1e293b);
  border-color:color-mix(in srgb,var(--c,#2563eb) 60%,transparent);
}
.tag:hover{box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tag.st{border-style:dashed;
  background:color-mix(in srgb,var(--c,#b45309) 28%,#fff);
  color:color-mix(in srgb,var(--c,#b45309) 90%,#1e293b);
  border-color:color-mix(in srgb,var(--c,#b45309) 60%,transparent);}
.tag.tmp{border-style:dotted;opacity:.9}
.tag-body{display:flex;align-items:center;gap:2px;flex:1;overflow:hidden;padding:0 3px 0 5px;min-width:0}
.tag-nm{overflow:hidden;text-overflow:ellipsis;flex:1;pointer-events:none;font-size:10px}
.tag-x{font-size:9px;opacity:.55;cursor:pointer;flex-shrink:0;padding:1px 3px;border-radius:3px;color:inherit}
.tag-x:hover{opacity:1;background:color-mix(in srgb,var(--c,#3b82f6) 20%,transparent)}
.tag-rz{
  position:absolute;right:0;top:0;bottom:0;width:7px;
  cursor:ew-resize;flex-shrink:0;
  background:color-mix(in srgb,var(--c,#3b82f6) 25%,transparent);
  border-radius:0 4px 4px 0;
  display:flex;align-items:center;justify-content:center;
}
.tag-rz::after{content:'⋮';font-size:9px;color:color-mix(in srgb,var(--c,#3b82f6) 80%,#000);pointer-events:none}

/* ═══════════════════ PANEL ÉQUIPE ═══════════════════ */
.pp{
  width:148px;flex-shrink:0;
  background:#f8fafc;border-left:1px solid #e2e8f0;
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;z-index:15;
  transition:width .25s ease;
}
.pp.collapsed{width:32px}
.pp.collapsed .wlist{display:none}
.pp.collapsed .pp-head span:not(.bdg){display:none}
.pp.collapsed .bdg{display:none}
.pp-toggle{
  background:none;border:none;cursor:pointer;
  font-size:14px;color:var(--dim);padding:2px 4px;
  border-radius:4px;flex-shrink:0;
}
.pp-toggle:hover{background:var(--bord);color:var(--text)}
/* Sur mobile : panel en overlay flottant */
@media(max-width:768px){
  :root{--CH:24px;--NOM:80px;--CW:calc((100vw - 80px - 115px) / 10)}
  .pp{
    position:fixed;right:0;top:50px;bottom:0;
    width:140px;z-index:100;
    box-shadow:-4px 0 16px rgba(0,0,0,.15);
    transform:translateX(100%);
    transition:transform .25s ease;
    flex-shrink:0;
  }
  /* La grille prend toute la largeur — pp est hors flux (fixed) */
  .app{display:block;width:100vw}
  .grid-wrap{width:100vw!important;max-width:100vw!important;height:calc(100vh - 50px)}
  .pp.open{transform:translateX(0)}
  /* Bouton flottant pour ouvrir le panel sur mobile */
  #ppToggleFloat{
    display:flex;position:fixed;right:8px;bottom:16px;z-index:110;
    width:44px;height:44px;border-radius:50%;
    background:var(--acc);color:#fff;border:none;
    font-size:18px;cursor:pointer;
    align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(79,116,227,.4);
  }
  header{height:44px}
  .week-dates{display:none}
  /* Masquer tous les boutons sauf Aujourd'hui et ☰ */
  .hbtns .ibtn{display:none!important}
  #bToday{display:inline-flex!important;padding:5px 8px;font-size:11px}
  #bMenu{display:inline-flex!important;padding:5px 10px;font-size:18px;line-height:1}
  /* Bottom sheet menu */
  #mobileMenuOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199;display:none}
  #mobileMenuOverlay.on{display:block}
  #mobileMenu{
    position:fixed;bottom:0;left:0;right:0;
    background:#1e293b;border-radius:16px 16px 0 0;
    padding:14px 16px 32px;z-index:200;
    transform:translateY(100%);transition:transform .28s ease;
    box-shadow:0 -4px 24px rgba(0,0,0,.35);
  }
  #mobileMenu.open{transform:translateY(0)}
  #mobileMenu .mm-title{
    text-align:center;color:#64748b;font-size:11px;
    font-weight:600;text-transform:uppercase;letter-spacing:.8px;
    margin-bottom:12px;padding-bottom:8px;
    border-bottom:1px solid #334155;
  }
  #mobileMenu .mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #mobileMenu .mm-grid button{
    background:#334155;border:1px solid #475569;color:#e2e8f0;
    border-radius:10px;padding:12px 8px;
    font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;
  }
  #mobileMenu .mm-grid button .mm-icon{font-size:22px}
  #mobileMenu .mm-grid button .mm-label{font-size:10px;color:#94a3b8}
  #mobileMenu .mm-close{
    margin-top:10px;background:#0891b2;color:#fff;
    border:none;border-radius:10px;padding:13px;
    width:100%;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
  }
}
@media(min-width:769px){
  #ppToggleFloat{display:none!important}
  #bMenu{display:none!important}
}
.pp-head{
  padding:7px 10px;border-bottom:1px solid var(--bord);
  font-size:10px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:.9px;
  display:flex;align-items:center;justify-content:space-between;
  background:#f1f5f9;flex-shrink:0;
}
.pp-head .bdg{background:#0891b2;color:#fff;border-radius:9px;padding:1px 7px;font-size:10px;font-weight:700}
.wlist{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.wlist::-webkit-scrollbar{width:3px}
.wlist::-webkit-scrollbar-thumb{background:var(--bord);border-radius:2px}
.wcard{
  border-radius:7px;padding:6px 8px;
  background:color-mix(in srgb,var(--c,#2563eb) 16%,#fff);
  border:1.5px solid color-mix(in srgb,var(--c,#2563eb) 45%,#e2e8f0);
  cursor:grab;user-select:none;touch-action:none;
  display:flex;align-items:center;gap:5px;
  transition:box-shadow .12s,transform .1s;
}
.wcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);transform:translateX(-1px)}
.wcard:active{cursor:grabbing}
.wcard.st{border-style:dashed}
.wcard.tmp{border-style:dotted}
.wdot{width:8px;height:8px;border-radius:50%;background:var(--c,#3b82f6);flex-shrink:0}
.wdot.st{border-radius:2px}
.wdot.tmp{transform:rotate(45deg);border-radius:0}
.wname{font-size:11px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcnt{font-size:10px;font-weight:700;background:rgba(0,0,0,.07);border-radius:4px;padding:1px 5px;color:var(--dim)}
.wcnt.z{background:#fee2e2;color:#dc2626}
.wsbadge{font-size:8px;font-weight:800;border-radius:3px;padding:1px 4px;flex-shrink:0}
.sect-div{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
  padding:6px 2px 2px;display:flex;align-items:center;gap:5px}
.sect-div::after{content:'';flex:1;height:1px;background:var(--bord)}
.sect-div.st-div{color:#d97706}
.sect-div.tmp-div{color:#8b5cf6}

/* ═══════════════════ MODALS ═══════════════════ */
.mover{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px}
.mover.off{display:none}
.modal{background:#fff;border:1px solid #e2e8f0;border-radius:12px;
  padding:20px;width:100%;max-width:440px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.modal h3{font-size:14px;font-weight:700;margin-bottom:14px;color:#0f172a;
  padding-bottom:10px;border-bottom:1px solid #e2e8f0}
.mf{margin-bottom:9px}
.mf label{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;
  letter-spacing:.6px;display:block;margin-bottom:3px}
.mf input,.mf select,.mf textarea{
  width:100%;background:var(--surf2);border:1px solid var(--bord);
  border-radius:7px;color:var(--text);padding:7px 9px;font-size:13px;
  font-family:inherit;outline:none}
.mf input:focus,.mf select:focus{border-color:var(--acc)}
.mf select[size]{height:auto;padding:3px}
.mf select[size] option{padding:5px 8px;border-radius:4px;cursor:pointer}
.mf select[size] option:checked{background:var(--acc);color:#fff}
.mrow{display:flex;gap:7px}.mrow>.mf{flex:1}
.mbtns{display:flex;gap:7px;margin-top:10px}
.mbtns button{flex:1;padding:8px;border-radius:7px;border:none;cursor:pointer;
  font-size:13px;font-weight:600;font-family:inherit}
.mbtns .ok{background:var(--acc);color:#fff}
.mbtns .no{background:var(--surf2);color:var(--text);border:1px solid var(--bord)!important}
/* Onglets modal */
.mtabs{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--bord);margin-bottom:12px}
.mtab{flex:1;padding:8px;border:none;cursor:pointer;font-weight:700;font-size:12px;
  font-family:inherit;background:var(--surf2);color:var(--dim);transition:all .15s}
.mtab.on{background:var(--acc);color:#fff}

/* Config panel */
.cfgpan{position:fixed;top:48px;right:0;bottom:0;width:295px;background:var(--surf);
  border-left:1px solid var(--bord);z-index:80;padding:14px;overflow-y:auto;
  transform:translateX(100%);transition:transform .3s;box-shadow:-4px 0 16px rgba(0,0,0,.07)}
.cfgpan.on{transform:translateX(0)}
.cfgpan h4{font-size:14px;font-weight:700;margin-bottom:12px}
.cfg-s{margin-bottom:12px}
.cfg-s label{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;
  letter-spacing:.7px;display:block;margin-bottom:4px}
.cfg-s input,.cfg-s select{width:100%;background:var(--surf2);border:1px solid var(--bord);

function fbEncKey(k){return String(k).replace(/\./g,'__D__').replace(/#/g,'__H__').replace(/\$/g,'__S__').replace(/\//g,'__SL__').replace(/\[/g,'__LB__').replace(/\]/g,'__RB__');}
function fbDecKey(k){return String(k).replace(/__D__/g,'.').replace(/__H__/g,'#').replace(/__S__/g,'$').replace(/__SL__/g,'/').replace(/__LB__/g,'[').replace(/__RB__/g,']');}
function fbEnc(o){if(o===null||typeof o!=='object')return o;if(Array.isArray(o))return o.map(fbEnc);const r={};for(const k in o)r[fbEncKey(k)]=fbEnc(o[k]);return r;}
function fbDec(o){if(o===null||typeof o!=='object')return o;if(Array.isArray(o))return o.map(fbDec);const r={};for(const k in o)r[fbDecKey(k)]=fbDec(o[k]);return r;}

    _fbRef.once('value',snap=>{

function wkDates(off=G.off){
  const n=new Date(),d=n.getDay()||7,m=new Date(n);
  m.setDate(n.getDate()-d+1+off*7);
  return Array.from({length:7},(_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return x;});
}
function isoW(d){const j=new Date(d.getFullYear(),0,4),w=new Date(j);w.setDate(j.getDate()-((j.getDay()||7)-1));return Math.ceil(((d-w)/86400000+1)/7);}
function wkey(off=G.off){const d=wkDates(off)[0];return d.getFullYear()+'-W'+isoW(d);}
function fD(d){return d.getDate()+'/'+(d.getMonth()+1)+'/'+(d.getFullYear()+'').slice(2);}
function isoDate(d){return d.toISOString().split('T')[0];}
function isToday(d){return d.toDateString()===new Date().toDateString();}

// Jours fériés (algorithme Anonymous Gregorian)
function getEaster(y){const a=y%19,b=Math.floor(y/100),c2=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c2/4),k=c2%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);const mo=Math.floor((h+l-7*m+114)/31)-1,day=(h+l-7*m+114)%31+1;return new Date(y,mo,day);}
function joursFeries(y){const p=getEaster(y);const add=(d,n)=>{const x=new Date(d);x.setDate(d.getDate()+n);return x;};return[new Date(y,0,1),add(p,1),new Date(y,4,1),new Date(y,4,8),add(p,39),add(p,50),new Date(y,6,14),new Date(y,7,15),new Date(y,10,1),new Date(y,10,11),new Date(y,11,25)].map(d=>d.toDateString());}

function blks(ch,wk=wkey()){if(!G.planning[wk])G.planning[wk]={};if(!G.planning[wk][ch])G.planning[wk][ch]=[];return G.planning[wk][ch];}
function setBlks(ch,arr,wk=wkey()){if(!G.planning[wk])G.planning[wk]={};G.planning[wk][ch]=arr;}
function getV(ch,di){return((G.visits[wkey()]||{})[ch]||{})[di]||'';}
function setV(ch,di,v){if(!G.visits[wkey()])G.visits[wkey()]={};if(!G.visits[wkey()][ch])G.visits[wkey()][ch]={};G.visits[wkey()][ch][di]=v;}

function statut(wn,date){
  if(!G.absences)return'';
  const d=new Date(date);d.setHours(12,0,0,0);
  const a=G.absences.find(x=>x.n===wn&&new Date(x.deb+'T12:00:00')<=d&&new Date(x.fin+'T12:00:00')>=d);
  return a?a.type:'';
}
function workerVisibleThisWeek(w){
  if(w.t!=='tmp')return true;
  const dd=wkDates();const ws=new Date(dd[0]);ws.setHours(0,0,0,0);const we=new Date(dd[6]);we.setHours(23,59,59,999);
  if(!w.deb||!w.fin)return true;
  return new Date(w.deb+'T00:00:00')<=we&&new Date(w.fin+'T23:59:59')>=ws;
}
function wCol(n){return(G.workers.find(w=>w.n===n)||{}).col||'c0';}
function wType(n){return(G.workers.find(w=>w.n===n)||{}).t||'w';}
function getCSSColor(cls){const m={c0:'#3b82f6',c1:'#10b981',c2:'#06b6d4',c3:'#8b5cf6',c4:'#f59e0b',c5:'#ef4444',c6:'#ec4899',c7:'#14b8a6',c8:'#f97316',c9:'#6366f1',cs0:'#f59e0b',cs1:'#f97316',cs2:'#ef4444',cs3:'#eab308',ct0:'#a78bfa',ct1:'#f472b6',ct2:'#2dd4bf'};return m[cls]||'#3b82f6';}

// Blocs absences pour une semaine
function syncAbsencesToBlks(){
  if(!G.absences||!G.absences.length)return;
  const SPMAP={cfa:'_cfa',cp:'_cp',abs:'_abs'};
  const wk=wkey();const dd=wkDates();
  if(!G.planning[wk])G.planning[wk]={};
  G.planning[wk]['_cfa']=[];G.planning[wk]['_cp']=[];G.planning[wk]['_abs']=[];
  G.absences.forEach(a=>{
    const ch=SPMAP[a.type];if(!ch)return;
    const d0=new Date(a.deb+'T12:00:00'),d1=new Date(a.fin+'T12:00:00');
    dd.forEach((date,di)=>{
      const dj=new Date(date);dj.setHours(12,0,0,0);
      if(dj<d0||dj>d1)return;
      const slotM=di*2;const bl=G.planning[wk][ch];
      if(!bl.some(b=>b.w===a.n&&b.s===slotM))
        bl.push({id:'abs_'+a.id+'_'+di,w:a.n,s:slotM,sp:2});
    });
  });
}

function addBlk(ch,worker,start,span=1){
  pushHist();
  const SPMAP={_cfa:'cfa',_cp:'cp',_abs:'abs'};
  if(SPMAP[ch]){
    const type=SPMAP[ch];const iso=isoDate(wkDates()[sDay(start)]);
    if(!G.absences)G.absences=[];
    const bl=blks(ch);
    if(bl.some(b=>b.w===worker&&b.s<start+2&&b.s+b.sp>start))return false;
    const bid='b'+Date.now()+Math.random().toString(36).slice(2,4);
    bl.push({id:bid,w:worker,s:start,sp:1});setBlks(ch,bl);
    if(!G.absences.find(a=>a.n===worker&&a.type===type&&a.deb<=iso&&a.fin>=iso))
      G.absences.push({id:'a'+Date.now(),n:worker,type,deb:iso,fin:iso});
    save();return true;
  }
  const bl=blks(ch);
  if(bl.some(b=>b.w===worker&&b.s<start+span&&b.s+b.sp>start))return false;
  bl.push({id:'b'+Date.now()+Math.random().toString(36).slice(2,4),w:worker,s:start,sp:span});
  setBlks(ch,bl);save();return true;
}
function rmBlk(ch,id){
  pushHist();
  const SPMAP={_cfa:'cfa',_cp:'cp',_abs:'abs'};
  if(SPMAP[ch]){
    const b=blks(ch).find(x=>x.id===id);
    if(b){
      const iso=isoDate(wkDates()[sDay(b.s)]);
      G.absences=G.absences.filter(a=>{
        if(a.n!==b.w||a.type!==SPMAP[ch])return true;
        if(a.deb===iso&&a.fin===iso)return false;
        if(a.deb===iso)a.deb=nxtDay(iso);
        else if(a.fin===iso)a.fin=prvDay(iso);
        else{const f1=prvDay(iso);G.absences.push({id:'a'+Date.now(),n:a.n,type:a.type,deb:nxtDay(iso),fin:a.fin});a.fin=f1;}
        return true;
      });
    }
    setBlks(ch,blks(ch).filter(b=>b.id!==id));save();return;
  }
  setBlks(ch,blks(ch).filter(b=>b.id!==id));save();
}
function updBlk(ch,id,ns,nsp){
  pushHist();
  const bl=blks(ch),b=bl.find(x=>x.id===id);if(!b)return;
  const nDays=G.showWE?7:5;
  ns=Math.max(0,Math.min(ns,nDays*2-1));nsp=Math.max(1,Math.min(nsp,nDays*2-ns));
  if(bl.some(x=>x.id!==id&&x.w===b.w&&x.s<ns+nsp&&x.s+x.sp>ns))return;
  b.s=ns;b.sp=nsp;save();
}
function nxtDay(iso){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+1);return isoDate(d);}
function prvDay(iso){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()-1);return isoDate(d);}

// Chantier visible cette semaine
function isChHidden(ch){
  const wk=wkey();
  if(((G.hiddenChantiers||{})[wk]||[]).includes(ch))return true;
  if(((G.shownChantiers||{})[wk]||[]).includes(ch))return false;
  if((G.chantiersDone||[]).includes(ch))return blks(ch).length===0;
  const meta=(G.chantiersMeta||{})[ch];
  if(meta&&meta.deb&&meta.fin){
    const dd=wkDates(),wS=new Date(dd[0]),wE=new Date(dd[6]);
    wS.setHours(0,0,0,0);wE.setHours(23,59,59,999);
    const mD=new Date(meta.deb+'T00:00:00'),mF=new Date(meta.fin+'T23:59:59');
    if(mF<wS||mD>wE)return true;
    return false;
  }
  if(G.off>0&&blks(ch).length===0)return true;
  return false;
}
function showChThisWeek(ch){
  if(!G.shownChantiers)G.shownChantiers={};
  const wk=wkey();
  if(!G.shownChantiers[wk])G.shownChantiers[wk]=[];
  if(!G.shownChantiers[wk].includes(ch))G.shownChantiers[wk].push(ch);
  if(G.hiddenChantiers&&G.hiddenChantiers[wk])
    G.hiddenChantiers[wk]=G.hiddenChantiers[wk].filter(x=>x!==ch);
}
function hideChThisWeek(ch){
  pushHist();
  if(!G.hiddenChantiers)G.hiddenChantiers={};
  const wk=wkey();
  if(!G.hiddenChantiers[wk])G.hiddenChantiers[wk]=[];
  if(!G.hiddenChantiers[wk].includes(ch))G.hiddenChantiers[wk].push(ch);
  if(G.shownChantiers&&G.shownChantiers[wk])
    G.shownChantiers[wk]=G.shownChantiers[wk].filter(x=>x!==ch);
  if(G.planning[wk])delete G.planning[wk][ch];
  save();render();
}

function renderGrid(){
  const tb=document.getElementById('pbody');tb.innerHTML='';

    addChRow(tb,ch,dd,feries,nDays,false,'','');

  });

  // Séparateur avant lignes spéciales
  addSpacerRow(tb,true,nDays);
  [['_cfa','cfa','CFA'],['_cp','cp','Congés'],['_abs','abs','Absences']]
    .forEach(([ch,t,lbl])=>{addChRow(tb,ch,dd,feries,nDays,true,t,lbl);addSpacerRow(tb,false,nDays);});

function addSpacerRow(tb,lg,nDays){
  const tr=document.createElement('tr');
  const td=document.createElement('td');td.colSpan=1+nDays*2+1;td.className=lg?'spacer-lg':'spacer';
  tr.appendChild(td);tb.appendChild(tr);
}

function addChRow(tb,ch,dd,feries,nDays,isSp,absType,spLbl){
  const tr=document.createElement('tr');
  // Cellule nom (rowspan=2 → couvre titre + slots)
  const tdN=document.createElement('td');
  if(isSp){tdN.className=`sptit ${absType}`;tdN.textContent=spLbl;tdN.rowSpan=1;}
  else{
    tdN.className='chtit';tdN.textContent=ch;tdN.rowSpan=2;
    const bx=document.createElement('button');bx.className='chtit-x';bx.textContent='✕';
    bx.title='Masquer cette semaine';
    bx.addEventListener('click',e=>{e.stopPropagation();hideChThisWeek(ch);});
    tdN.appendChild(bx);
  }
  tr.appendChild(tdN);
  // Pastilles visite (seulement chantiers normaux, dans la ligne titre)
  if(!isSp){
    for(let di=0;di<nDays;di++){
      const tdV=document.createElement('td');tdV.colSpan=2;
      tdV.className='vtick-cell'+(isToday(dd[di])?' today-vc':'');
      if(di===5)tdV.style.borderLeft='2px solid #3d5a9a';
      const v=getV(ch,di);
      const tk=document.createElement('button');
      tk.className='vtick'+(v==='X'?' has-v-x':v?' has-v':'');
      tk.textContent=v||'';
      tk.addEventListener('click',e=>{
        e.stopPropagation();
        const cur=getV(ch,di);
        if(cur){setV(ch,di,'');tk.textContent='';tk.className='vtick';save();return;}
        captureOneLetter(tk,ch,di);
      });
      tdV.appendChild(tk);tr.appendChild(tdV);
    }
    // Cellule vide pour colonne bouton
    const tdX=document.createElement('td');tdX.className='ch-x-cell';tr.appendChild(tdX);
    tb.appendChild(tr);
    // Ligne slots (la td nom est déjà en rowspan=2)
    const trS=document.createElement('tr');
    addSlotCells(trS,ch,dd,feries,nDays,isSp,absType);
    tb.appendChild(trS);
  } else {
    // Ligne spéciale : titre colspan + cellules slots dans la même ligne
    for(let di=0;di<nDays;di++){
      for(let hi=0;hi<2;hi++){
        const slotI=sid(di,DEMI[hi]);
        const td=document.createElement('td');
        let cls=hi===0?'am':'';
        if(di>=5)cls+=' wk';
        if(di===5&&hi===0)cls+=' wks';
        cls+=` sp-${absType}`;
        if(isToday(dd[di]))cls+=' today-col';
        if(feries.includes(dd[di].toDateString()))cls+=' jf';
        td.className=cls.trim();
        td.dataset.ch=ch;td.dataset.s=slotI;td.dataset.d=di;td.dataset.h=DEMI[hi];
        tr.appendChild(td);
      }
    }
    const tdX=document.createElement('td');tr.appendChild(tdX);
    tb.appendChild(tr);
  }
}

function addSlotCells(tr,ch,dd,feries,nDays,isSp,absType){
  for(let di=0;di<nDays;di++){
    for(let hi=0;hi<2;hi++){
      const slotI=sid(di,DEMI[hi]);
      const td=document.createElement('td');
      let cls=hi===0?'am':'';
      if(di>=5)cls+=' wk';
      if(di===5&&hi===0)cls+=' wks';
      if(isToday(dd[di]))cls+=' today-col';
      if(feries.includes(dd[di].toDateString()))cls+=' jf';
      td.className=cls.trim();
      td.dataset.ch=ch;td.dataset.s=slotI;td.dataset.d=di;td.dataset.h=DEMI[hi];
      tr.appendChild(td);
    }
  }
  const tdX=document.createElement('td');tr.appendChild(tdX);
}

// Capture 1 lettre pour pastille visite
function captureOneLetter(tk,ch,di){
  const inp=document.createElement('input');
  inp.style.cssText='position:fixed;opacity:0;width:1px;height:1px;pointer-events:none;top:0;left:0';
  document.body.appendChild(inp);inp.focus();
  inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Escape'){inp.remove();return;}
    const l=e.key.length===1?e.key.toUpperCase():'';
    if(!l){inp.remove();return;}
    setV(ch,di,l);tk.textContent=l;
    tk.className='vtick'+(l==='X'?' has-v-x':' has-v');
    save();inp.remove();
  });
  inp.addEventListener('blur',()=>inp.remove());
}

function renderWPanel(){

    if(cnt[b.w]===undefined)return;
    for(let s=b.s;s<b.s+b.sp;s++)cnt[b.w].add(Math.floor(s/2));
  }));
  const cntN={};G.workers.forEach(w=>cntN[w.n]=cnt[w.n]?cnt[w.n].size:0);
  const sal=G.workers.filter(w=>w.t==='w');

  if(sts.length){const dv=document.createElement('div');dv.className='sect-div st-div';dv.textContent='S/traitants';l.appendChild(dv);sts.forEach(w=>l.appendChild(mkWCard(w,cntN[w.n]||0)));}
  if(tmps.length){const dv=document.createElement('div');dv.className='sect-div tmp-div';dv.textContent='Intérim';l.appendChild(dv);tmps.forEach(w=>l.appendChild(mkWCard(w,cntN[w.n]||0)));}
  document.getElementById('wbadge').textContent=sal.length+sts.length+tmps.length;

  if(sel){sel.innerHTML='';G.workers.forEach(w=>{const o=document.createElement('option');o.value=w.n;o.textContent=`${w.n} (${w.t==='s'?'S/T':w.t==='tmp'?'Int.':'Sal.'})`;sel.appendChild(o);});}
}

function mkWCard(w,cnt){
  const c=document.createElement('div');
  c.className=`wcard ${w.col}${w.t==='s'?' st':w.t==='tmp'?' tmp':''}`;
  c.dataset.w=w.n;
  const dot=document.createElement('div');dot.className=`wdot${w.t==='s'?' st':w.t==='tmp'?' tmp':''}`;c.appendChild(dot);
  const dd=wkDates();let st='';
  for(const d of dd){st=statut(w.n,d);if(st)break;}
  const stH=st?`<span class="wsbadge" style="background:${st==='cfa'?'#78350f':st==='cp'?'#1c1c1c':'#991b1b'};color:${st==='cfa'?'#fef3c7':st==='cp'?'#f3f4f6':'#fee2e2'}">${st.toUpperCase()}</span>`:'';
  c.innerHTML+=`<span class="wname">${w.n}</span><span class="wcnt ${cnt===0?'z':''}">${cnt}j</span>${stH}`;

}

// ═══════════════════════════════════════════════════════
// PLACEMENT DES TAGS (overlay)
// ═══════════════════════════════════════════════════════
function placeAllTags(){
  const ov=document.getElementById('ov');
  const gw=document.getElementById('gw');
  if(!ov||!gw)return;
  ov.innerHTML='';

  // Lire CW depuis une cellule réelle du tableau (fiable quelle que soit la résolution)
  const refCell=document.querySelector('.ptable td[data-s="0"]');
  if(refCell){const w=refCell.getBoundingClientRect().width;if(w>1)CW=w;}
  const refCellH=document.querySelector('.ptable td[data-s]');
  if(refCellH){const h=refCellH.getBoundingClientRect().height;if(h>1)CH=h;}

  const TAG_H=CH-4;
  const TAG_GAP=2;
  const nDays=G.showWE?7:5;

  // Étape 1 : ajuster hauteurs des lignes
  function countAtSlot(ch,s){return blks(ch).filter(b=>b.s<=s&&b.s+b.sp>s).length;}
  function setRowH(ch){
    let max=0;
    for(let di=0;di<nDays;di++)for(let hi=0;hi<2;hi++){const n=countAtSlot(ch,sid(di,DEMI[hi]));if(n>max)max=n;}
    const h=max<=0?CH:TAG_GAP+max*(TAG_H+TAG_GAP);
    document.querySelectorAll(`.ptable td[data-ch="${CSS.escape(ch)}"]`).forEach(td=>{td.style.height=Math.max(h,CH)+'px';});
  }
  G.chantiers.filter(ch=>!isChHidden(ch)).forEach(setRowH);
  ['_cfa','_cp','_abs'].forEach(setRowH);

  // Étape 2 : placer les tags après repaint
  requestAnimationFrame(()=>{
    const gwR=gw.getBoundingClientRect();
    function placeCh(ch){
      for(let di=0;di<nDays;di++){
        for(let hi=0;hi<2;hi++){
          const slotI=sid(di,DEMI[hi]);
          const cell=document.querySelector(`.ptable td[data-ch="${CSS.escape(ch)}"][data-s="${slotI}"]`);
          if(!cell)continue;
          const cR=cell.getBoundingClientRect();
          const left=cR.left-gwR.left+gw.scrollLeft;
          const top=cR.top-gwR.top+gw.scrollTop;
          const allAtSlot=blks(ch).filter(b=>b.s<=slotI&&b.s+b.sp>slotI);
          blks(ch).filter(b=>b.s===slotI).forEach(b=>{
            const idx=allAtSlot.indexOf(b);
            const tag=mkTag(b.w,b.id,ch,wCol(b.w),wType(b.w),b.sp,di);
            tag.style.left=(left+2)+'px';
            tag.style.top=(top+TAG_GAP+idx*(TAG_H+TAG_GAP))+'px';
            tag.style.width=(b.sp*CW-6)+'px';
            tag.style.height=TAG_H+'px';
            ov.appendChild(tag);
          });
        }
      }
    }
    G.chantiers.filter(ch=>!isChHidden(ch)).forEach(placeCh);
    ['_cfa','_cp','_abs'].forEach(placeCh);
  });
}

function goToWeek(week,year){
  // Calculer G.off depuis la semaine cible
  const now=new Date();
  const nowOff=G.off; // offset actuel
  // Date du lundi de la semaine cible
  const jan4=new Date(year,0,4);
  const jan4day=(jan4.getDay()||7)-1;
  const w1mon=new Date(jan4);w1mon.setDate(jan4.getDate()-jan4day);
  const targetMon=new Date(w1mon);targetMon.setDate(w1mon.getDate()+(week-1)*7);
  // Date du lundi de la semaine courante (off=0)
  const today=new Date();const tod=(today.getDay()||7)-1;
  const curMon=new Date(today);curMon.setDate(today.getDate()-tod);
  // Différence en semaines
  const diffMs=targetMon-curMon;
  const diffWeeks=Math.round(diffMs/(7*24*3600*1000));
  G.off=diffWeeks;save();render();closeWeekPicker();
}

// COMMANDES
// ═══════════════════════════════════════════════════
function cmdStatut(cmd){
  if(!cmd.deb)return'fut';
  const today=new Date();today.setHours(0,0,0,0);
  const dd=wkDates(),wS=new Date(dd[0]),wE=new Date(dd[6]);
  wS.setHours(0,0,0,0);wE.setHours(23,59,59,999);
  const s=new Date(cmd.deb+'T12:00:00');
  const diff=Math.round((s-today)/86400000);
  if(s>=wS&&s<=wE)return'this';
  if(diff<0)return'late';
  if(diff<=14)return'soon';
  return'fut';
}
function renderCmdList(){
  const l=document.getElementById('cmdlist');if(!l)return;
  l.innerHTML='';
  if(!G.commandes||!G.commandes.length){
    l.innerHTML='<div style="text-align:center;font-size:11px;color:var(--dim);padding:8px">Aucune commande.</div>';return;
  }
  const ST={this:{lb:'🔵 Cette semaine',cls:'this-week'},late:{lb:'🔴 En retard',cls:'late'},soon:{lb:'🟡 Dans 2 sem.',cls:'urgent'},fut:{lb:'⚪ À venir',cls:''},done:{lb:'✅ Activé',cls:''}};
  const ord=['late','this','soon','fut','done'];
  [...G.commandes].sort((a,b)=>ord.indexOf(cmdStatut(a))-ord.indexOf(cmdStatut(b))).forEach(cmd=>{
    const st=cmdStatut(cmd);const info=ST[st]||ST.fut;
    const durStr=cmd.durN?`${cmd.durN} ${{j:'j.',sem:'sem.',mois:'mois'}[cmd.durU]||''}`.trim():'';
    const ds=cmd.deb?new Date(cmd.deb+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'?';
    const div=document.createElement('div');div.className='cmd-card '+info.cls;
    div.innerHTML=`
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:11px;font-weight:700;flex:1">${cmd.nom}</span>
        <span class="cbdg" style="color:var(--dim);border-color:var(--bord)">${info.lb}</span>
      </div>
      <div style="font-size:10px;color:var(--dim)">📅 ${ds}${durStr?' · ⏱ '+durStr:''}${cmd.con?' · 📞 '+cmd.con:''}</div>
      ${cmd.not?`<div style="font-size:10px;color:var(--dim);font-style:italic">${cmd.not}</div>`:''}
      <div class="cmd-bts">
        <button class="cmd-bt act" data-id="${cmd.id}" data-a="act">➕ Activer semaine</button>
        <button class="cmd-bt" data-id="${cmd.id}" data-a="del">🗑 Supprimer</button>
      </div>`;
    div.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const cmd2=G.commandes.find(x=>x.id===b.dataset.id);if(!cmd2)return;
      if(b.dataset.a==='act'){
        if(!G.chantiers.includes(cmd2.nom))G.chantiers.push(cmd2.nom);
        G.chantiersDone=(G.chantiersDone||[]).filter(x=>x!==cmd2.nom);
        showChThisWeek(cmd2.nom);
        if(cmd2.durN){const debSem=wkDates()[0];let fin=new Date(debSem);if(cmd2.durU==='j')fin.setDate(fin.getDate()+parseInt(cmd2.durN));else if(cmd2.durU==='sem')fin.setDate(fin.getDate()+parseInt(cmd2.durN)*7);else fin.setMonth(fin.getMonth()+parseInt(cmd2.durN));if(!G.chantiersMeta)G.chantiersMeta={};G.chantiersMeta[cmd2.nom]={deb:isoDate(debSem),fin:isoDate(fin)};}
        // Marquer comme activé
        G.commandes=G.commandes.filter(x=>x.id!==cmd2.id);
        save();render();renderCmdList();
        toast(`"${cmd2.nom}" activé sur la semaine`,'ok');
        document.getElementById('mCmd').classList.add('off');
      } else if(b.dataset.a==='del'){
        if(confirm(`Supprimer "${cmd2.nom}" du carnet ?`)){
          G.commandes=G.commandes.filter(x=>x.id!==cmd2.id);save();renderCmdList();
        }
      }
    }));
    l.appendChild(div);
  });
}
// Alertes sur la grille : bannière si commande prévue cette semaine
function renderCmdAlerts(){
  // Supprimer les anciennes alertes
  document.querySelectorAll('.cmd-alert').forEach(el=>el.remove());
  if(!G.commandes||!G.commandes.length)return;
  const alerts=G.commandes.filter(cmd=>cmdStatut(cmd)==='this'||cmdStatut(cmd)==='late');
  if(!alerts.length)return;
  const gw=document.getElementById('gw');
  const wrap=document.createElement('div');wrap.style.cssText='padding:4px 6px;display:flex;flex-direction:column;gap:3px';
  alerts.forEach(cmd=>{
    const div=document.createElement('div');div.className='cmd-alert';
    const st=cmdStatut(cmd);
    div.innerHTML=`<span>${st==='late'?'🔴':'🔵'}</span><span class="cmd-al-nom">Prévu : <strong>${cmd.nom}</strong>${cmd.deb?' — '+new Date(cmd.deb+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'}):''}</span><button data-id="${cmd.id}">➕ Activer</button>`;
    div.querySelector('button').addEventListener('click',()=>{
      const cmd2=G.commandes.find(x=>x.id===div.querySelector('button').dataset.id||x.nom===cmd.nom);
      if(!cmd2)return;
      if(!G.chantiers.includes(cmd2.nom))G.chantiers.push(cmd2.nom);
      showChThisWeek(cmd2.nom);
      G.commandes=G.commandes.filter(x=>x.id!==cmd2.id);
      save();render();toast(`"${cmd2.nom}" activé`,'ok');
    });
    wrap.appendChild(div);
  });
  // Insérer avant le tableau
  gw.insertBefore(wrap,gw.firstChild);
}

document.getElementById('bCmdClose').addEventListener('click',()=>document.getElementById('mCmd').classList.add('off'));

document.getElementById('bCmdAdd').addEventListener('click',()=>{

    id:'c'+Date.now(),

    deb:document.getElementById('cmdDeb').value,
    durN:document.getElementById('cmdDurN').value,
    durU:document.getElementById('cmdDurU').value,
    con:document.getElementById('cmdCon').value.trim(),
    not:document.getElementById('cmdNot').value.trim(),
  });
  document.getElementById('cmdNom').value='';
  document.getElementById('cmdDeb').value='';
  document.getElementById('cmdDurN').value='';
  document.getElementById('cmdCon').value='';
  document.getElementById('cmdNot').value='';
  save();renderCmdList();toast(`"${nom}" ajouté au carnet`,'ok');
});

document.getElementById('cgLogo').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{G.cfg.logo=ev.target.result;save();applyLogo();toast('Logo mis à jour','ok');};r.readAsDataURL(f);
});
function applyLogo(){
  const img=document.getElementById('logoImg'),txt=document.getElementById('logoTxt');
  if(G.cfg&&G.cfg.logo){img.src=G.cfg.logo;img.style.display='block';txt.style.display='none';}
  else{img.style.display='none';txt.style.display='block';}
}
document.getElementById('bAddW').addEventListener('click',()=>{
  const n=document.getElementById('cgWn').value.trim();if(!n)return;
  if(G.workers.find(w=>w.n===n)){toast('Nom existant','err');return;}
  const sal=G.workers.filter(w=>w.t==='w');
  G.workers.push({id:'w'+Date.now(),n,col:WCOLS[sal.length%WCOLS.length],t:'w'});
  document.getElementById('cgWn').value='';save();render();toast(`${n} ajouté`,'ok');
});
document.getElementById('bAddST').addEventListener('click',()=>{
  const n=document.getElementById('cgSTn').value.trim();if(!n)return;
  if(G.workers.find(w=>w.n===n)){toast('Nom existant','err');return;}
  const sts=G.workers.filter(w=>w.t==='s');
  G.workers.push({id:'w'+Date.now(),n,col:STCOLS[sts.length%STCOLS.length],t:'s'});
  document.getElementById('cgSTn').value='';save();render();toast(`${n} ajouté`,'ok');
});
document.getElementById('bAddTmp').addEventListener('click',()=>{
  const n=document.getElementById('cgTn').value.trim();
  const deb=document.getElementById('cgTdeb').value,fin=document.getElementById('cgTfin').value;
  if(!n||!deb||!fin){toast('Nom, début et fin requis','err');return;}
  const tmps=G.workers.filter(w=>w.t==='tmp');
  G.workers.push({id:'w'+Date.now(),n,col:TCOLS[tmps.length%TCOLS.length],t:'tmp',deb,fin});
  document.getElementById('cgTn').value='';document.getElementById('cgTdeb').value='';document.getElementById('cgTfin').value='';
  save();render();toast(`${n} ajouté`,'ok');
});
document.getElementById('bDelW').addEventListener('click',()=>{
  const n=document.getElementById('cgDelW').value;if(!n||!confirm(`Supprimer "${n}" ?`))return;
  G.workers=G.workers.filter(w=>w.n!==n);save();render();toast(`${n} supprimé`,'ok');
});

let _tt;
function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast on '+type;clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),3000);}
